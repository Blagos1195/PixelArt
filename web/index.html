<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f5f5">
<title>Pixel Art Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="./">Pixel Art Generator</a>
</header>
<main class="layout">
  <section class="workspace">
    <aside class="panel controls">
      <h2>Image</h2>
      <label class="drop-zone" id="dropZone" for="fileInput">
        <strong>Drop an image here or browse</strong>
        <small>PNG, JPG, WEBP, GIF, BMP, TIFF</small>
      </label>
      <input id="fileInput" type="file" accept="image/*" hidden>
      <div class="source-row"><span id="fileName">No image selected</span><button class="text-button" id="clearImage" type="button">Clear</button></div>
      <hr>
      <h2>Settings</h2>
      <label class="field-label" for="preset">Input style</label>
      <select id="preset">
        <option value="balanced">General</option><option value="photo">Photograph</option><option value="illustration">Illustration / cartoon</option><option value="pixel-art">Pixel art / sprite</option><option value="grid-drawing">Grid-paper drawing</option><option value="line-art">Line art / logo</option>
      </select>
      <div class="field-pair">
        <label><span class="field-label">Pixel detail <output id="detailValue">80</output></span><input id="detail" type="range" min="12" max="240" value="80"></label>
        <label><span class="field-label">Colours <output id="colourValue">Auto</output></span><select id="colours"><option value="auto">Auto</option><option>4</option><option>8</option><option>12</option><option>16</option><option>24</option><option>32</option><option>48</option><option>64</option><option>128</option><option>256</option></select></label>
      </div>
      <label class="check-row"><input id="grid" type="checkbox"><span>Reduce faint grid lines</span></label>
      <hr>
      <h2>Drawing</h2>
      <label class="field-label" for="speed">Drawing speed <output id="speedValue">Normal</output></label>
      <input id="speed" type="range" min="1" max="100" value="48">
      <div class="speed-labels"><span>Slow</span><span>Fast</span></div>
      <label class="check-row"><input id="fast" type="checkbox"><span>Skip drawing animation</span></label>
      <div class="actions">
        <button id="generate" class="primary" type="button" disabled>Generate</button>
        <button id="compareDetail" class="secondary" type="button" disabled>Compare detail</button>
        <button id="compareColours" class="secondary" type="button" disabled>Compare colours</button>
      </div>
      <p class="privacy-note">Images are processed in your browser and are not uploaded.</p>
    </aside>
    <section class="panel preview-panel">
      <div class="preview-head"><h2 id="previewTitle">Preview</h2><div class="status" id="status"><i></i><span>Waiting for an image</span></div></div>
      <div class="canvas-wrap" id="canvasWrap">
        <div class="empty-state" id="emptyState"><strong>No image selected</strong><span>Choose an image to begin</span></div>
        <canvas id="artCanvas" hidden></canvas><canvas id="cursorCanvas" hidden></canvas>
      </div>
      <div class="progress-row"><div class="progress-track"><div id="progressBar"></div></div><span id="progressText">0%</span></div>
      <div class="preview-footer">
        <span id="blockCount">No blocks yet</span>
        <div class="preview-actions"><button class="secondary" id="pause" type="button" disabled>Pause</button><button class="secondary" id="restart" type="button" disabled>Restart</button><button class="primary small" id="download" type="button" disabled>Save PNG</button></div>
      </div>
      <div id="comparison" class="comparison" hidden></div>
    </section>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
